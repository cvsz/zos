name: validate-routeros-stack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync
      - name: Static safety validation
        run: ./tools/validate-repo.sh
      - name: Documentation validation
        run: python3 tools/validate-docs.py
      - name: zOS CLI smoke test
        run: ./zOS/bin/zos help
      - name: Block committed private keys and literal secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='*.md' \
            --exclude='*.example' \
            --exclude='validate-repo.sh' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|private key|-----BEGIN PGP PRIVATE KEY BLOCK-----)' .; then
            echo 'Potential embedded private key or literal secret found.' >&2
            exit 1
          fi

          if grep -RInE --include='*.ya?ml' --exclude-dir=.git \
            "(password|token):[[:space:]]*[\"']?[A-Za-z0-9_./+=-]{20,}[\"']?[[:space:]]*$" .github; then
            echo 'Potential literal CI secret found. GitHub expressions such as ${{ secrets.GITHUB_TOKEN }} are allowed.' >&2
            exit 1
          fi
