name: build-zos

on:
  push:
    branches: [main]
    tags: ['zos-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync

      - name: Validate stack
        run: |
          ./tools/validate-repo.sh
          python3 tools/validate-docs.py
          ./zOS/bin/zos help

      - name: Build zOS tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < zOS/VERSION)"
          STAGE="dist/zos-mikrotik-${VERSION}"
          mkdir -p "$STAGE"
          rsync -a --exclude '.git' --exclude 'dist' ./ "$STAGE/"
          tar -C dist -czf "dist/zos-mikrotik-${VERSION}.tar.gz" "zos-mikrotik-${VERSION}"
          sha256sum "dist/zos-mikrotik-${VERSION}.tar.gz" > "dist/zos-mikrotik-${VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zos-mikrotik-build
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mikrotik-zos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build zOS OCI package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: zOS/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
