name: build-zos

on:
  push:
    branches: [main]
    tags: ['zos-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync

      - name: Validate stack
        run: |
          ./tools/validate-repo.sh
          python3 tools/validate-docs.py
          ./zOS/bin/zos help

      - name: Build zOS tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < zOS/VERSION)"
          STAGE="dist/zos-mikrotik-${VERSION}"
          mkdir -p "$STAGE"
          rsync -a --exclude '.git' --exclude 'dist' ./ "$STAGE/"
          tar -C dist -czf "dist/zos-mikrotik-${VERSION}.tar.gz" "zos-mikrotik-${VERSION}"
          sha256sum "dist/zos-mikrotik-${VERSION}.tar.gz" > "dist/zos-mikrotik-${VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zos-mikrotik-build
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mikrotik-zos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build zOS OCI package
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: zOS/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
